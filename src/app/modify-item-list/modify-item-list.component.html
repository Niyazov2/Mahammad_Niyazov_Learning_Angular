<form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
    <label for="id">Event ID</label>
    <input id="id" formControlName="id" type="text">
    
    <label for="nameOfEvent">Event Name</label>
    <input id="nameOfEvent" formControlName="nameOfEvent" type="text">
  
    <label for="hostName">Host Name</label>
    <input id="hostName" formControlName="hostName" type="text">
    
    <label for="email">Email</label>
    <input id="email" formControlName="email" type="email">
    
    <label for="isAdmin">Is Admin</label>
    <input id="isAdmin" formControlName="isAdmin" type="checkbox">
  
    <button type="submit">Submit</button>
  </form>
